name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Offline classification tests
        run: node --test test/pipeline.test.mjs
      - name: Syntax check the browser engine
        run: node --check browser/pipeline.js
